server:
  port: ${PORT:8081}

spring:
  application:
    name: ms-rutaexpress-shipments

  # Oracle (local: contenedor del docker-compose de este proyecto, puerto 1522)
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1522/ORCLPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:SHIPMENTS_USER}
    password: ${SPRING_DATASOURCE_PASSWORD:ShipmentsPass2026!}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      pool-name: ShipmentsHikariPool

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}   # update agrega las columnas nuevas sin borrar datos
    show-sql: false

  # RabbitMQ (productor)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

logging:
  level:
    root: INFO
    com.rutaexpress.shipments: INFO
  file:
    name: logs/shipments.log
