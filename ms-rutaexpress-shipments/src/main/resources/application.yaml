server:
  port: ${PORT:8081} # Puerto del microservicio (8081 para shipments)
  servlet:
    context-path: /

spring:
  application:
    name: ms-rutaexpress-shipments


  # Configuracion de Conexion a Base de Datos Oracle RDS
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # URL de conexion (formato Service Name para Oracle RDS)
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:SHIPMENTS_USER}
    password: ${SPRING_DATASOURCE_PASSWORD:ShipmentsPass2026!}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: ShipmentsHikariPool


  # Configuracion de Persistencia JPA / Hibernate para Oracle
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update} # En produccion o desarrollo inicial (none / update)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25


# Configuracion de Logs para trazabilidad
logging:
  level:
    root: INFO
    com.rutaexpress.shipments: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE